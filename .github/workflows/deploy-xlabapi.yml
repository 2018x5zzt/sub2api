name: Deploy (xlabapi -> baota)

# 只要有提交 push 到 xlabapi 分支，就 SSH 到宝塔服务器，
# 把 /root/sub2api-src 更新到这次 push 的提交，再从源码构建镜像并重建容器。
on:
  push:
    branches: [xlabapi]
  workflow_dispatch: {}

# 串行部署：同一时刻只跑一个，避免并发重建容器互相打架
concurrency:
  group: deploy-xlabapi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to baota over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /root/sub2api-src
            git fetch origin xlabapi --prune
            git checkout -f xlabapi
            git reset --hard origin/xlabapi
            APPLY=1 /root/sub2api-deploy/deploy-image-from-source.sh
